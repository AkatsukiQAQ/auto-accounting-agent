[project]
name = "auto-accounting-agent"
version = "0.1.0"
description = "MITA Finance — receipt OCR + classification pipeline served as a FastAPI app."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "openai>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# The minimal set that backend/core/ depends on. Verifies the framework-free
# invariant of Phase 0: `uv pip install --extra core-only` installs only these
# two — anything else indicates backend/core/ leaked a legacy dependency.
core-only = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.uv]
# Default group(s) installed when running `uv sync` with no flags.
default-groups = ["dev"]
