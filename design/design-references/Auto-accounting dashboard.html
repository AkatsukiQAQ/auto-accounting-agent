<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Auto-accounting dashboard</title>
<style>
/* MITA Finance — design styles */
@import url("https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Shadows+Into+Light&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap");
/* MITA Finance — design styles
   Built on Master Component DS but tuned for warm cream + handwritten feel.
*/
@import url("https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Shadows+Into+Light&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap");
/* ds inlined */
/* ============================================================
   Master Component Design System
   Colors, Type, Spacing, Shadow, Radius — CSS variables
   ============================================================ */

/* -- Fonts ---------------------------------------------------- */
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap");

@font-face {
  font-family: "Geist";
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
  src: url("https://cdn.jsdelivr.net/npm/geist@latest/dist/fonts/geist-sans/Geist-Variable.woff2") format("woff2-variations"),
       url("https://cdn.jsdelivr.net/npm/geist@latest/dist/fonts/geist-sans/Geist-Variable.woff2") format("woff2");
}

:root {
  /* ========================================================
     COLOR — Neutral ladder (the backbone)
     ======================================================== */
  --white:        #ffffff;
  --gray-50:      #f9fafb;
  --gray-100:     #f3f4f6;
  --gray-200:     #e5e7eb;
  --gray-300:     #d1d5db;
  --gray-400:     #9ca3af;
  --gray-500:     #6b7280;
  --gray-600:     #4b5563;
  --gray-700:     #374151;
  --gray-800:     #1f2937;
  --gray-900:     #111827;
  --gray-950:     #030712;
  --black:        #000000;

  /* Semantic — Brand / Accent
     NOTE: purple is the Figma DS scaffolding color; for product UI
     the primary action color is near-black (gray-900). Both are exposed. */
  --brand-ds:     #9747ff;        /* design-system chrome / grids / labels */
  --brand-ds-50:  #f5eeff;
  --brand-ds-200: #d9bfff;

  /* Semantic — State */
  --success-500:  #22c55e;
  --success-400:  #4ade80;
  --success-50:   #ecfdf5;
  --info-500:     #3b82f6;
  --info-400:     #60a5fa;
  --info-50:      #eff6ff;
  --warning-500:  #d97706;
  --warning-400:  #f59e0b;
  --warning-50:   #fffbeb;
  --danger-700:   #b91c1c;
  --danger-600:   #dc2626;
  --danger-500:   #ef4444;
  --danger-400:   #f87171;
  --danger-200:   #fecaca;
  --danger-50:    #fef2f2;

  /* Accent pastels used in badges (from Figma: "LP" / "記事" chips) */
  --chip-lp:      #dfe17c;        /* LP */
  --chip-article: #e1ab7c;        /* 記事 */
  --chip-app:     #7cd0e1;        /* App */
  --chip-docs:    #a356a9;        /* Docs */

  /* ========================================================
     SEMANTIC tokens (prefer these in product code)
     ======================================================== */
  --fg:            var(--gray-950);   /* body text */
  --fg-strong:     var(--gray-900);
  --fg-muted:      var(--gray-500);
  --fg-subtle:     var(--gray-400);
  --fg-on-primary: var(--white);
  --fg-on-dark:    var(--white);
  --fg-link:       var(--gray-900);
  --fg-danger:     var(--danger-600);

  --bg:            var(--white);
  --bg-canvas:     var(--white);
  --bg-subtle:     var(--gray-100);
  --bg-muted:      var(--gray-50);
  --bg-inverse:    var(--gray-950);
  --bg-hover:      var(--gray-100);
  --bg-pressed:    var(--gray-200);

  --border:        var(--gray-200);
  --border-strong: var(--gray-300);
  --border-focus:  var(--gray-900);

  /* Primary action = near-black */
  --primary:          var(--gray-900);
  --primary-hover:    #0b1220;     /* one step darker */
  --primary-pressed:  #000000;
  --primary-fg:       var(--white);

  --secondary:        var(--gray-100);
  --secondary-hover:  var(--gray-200);
  --secondary-fg:     var(--gray-900);

  --outline-bg:       var(--white);
  --outline-border:   var(--gray-200);

  --ghost-hover:      var(--gray-100);

  --destructive:      var(--danger-600);
  --destructive-hover:var(--danger-700);
  --destructive-fg:   var(--white);

  /* ========================================================
     TYPE
     ======================================================== */
  --font-sans:    "Noto Sans JP", "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --font-ui:      "Geist", "Noto Sans JP", ui-sans-serif, system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-display: "Noto Sans JP", "Geist", ui-sans-serif, sans-serif;

  /* Display (LP / marketing / onboarding only) */
  --display-xl-size: 36px; --display-xl-lh: 1.2;  --display-xl-ls: -0.025em; --display-xl-weight: 700;
  --display-lg-size: 30px; --display-lg-lh: 1.375;--display-lg-ls: -0.025em; --display-lg-weight: 700;
  --display-md-size: 24px; --display-md-lh: 1.375;--display-md-ls: -0.025em; --display-md-weight: 700;
  --display-sm-size: 20px; --display-sm-lh: 1.5;  --display-sm-ls: -0.01em;  --display-sm-weight: 700;

  /* Heading (product UI) */
  --h1-size: 28px; --h1-lh: 1.5; --h1-ls: 0;      --h1-weight: 700;
  --h2-size: 24px; --h2-lh: 1.5; --h2-ls: 0;      --h2-weight: 700;
  --h3-size: 20px; --h3-lh: 1.5; --h3-ls: 0;      --h3-weight: 600;
  --h4-size: 18px; --h4-lh: 1.5; --h4-ls: 0;      --h4-weight: 600;
  --h5-size: 16px; --h5-lh: 1.5; --h5-ls: 0;      --h5-weight: 600;
  --h6-size: 14px; --h6-lh: 1.5; --h6-ls: 0;      --h6-weight: 600;

  /* Body — JP line-height is 1.75, widened from EN 1.5 for legibility */
  --body-xl-size: 20px; --body-xl-lh: 1.75; --body-xl-weight: 400;
  --body-lg-size: 18px; --body-lg-lh: 1.75; --body-lg-weight: 400;
  --body-md-size: 16px; --body-md-lh: 1.75; --body-md-weight: 400;
  --body-sm-size: 14px; --body-sm-lh: 1.75; --body-sm-weight: 400;
  --body-xs-size: 12px; --body-xs-lh: 1.625;--body-xs-weight: 400;
  --body-2xs-size:11px; --body-2xs-lh:1.625;--body-2xs-weight:400;

  /* Label */
  --label-lg-size: 16px; --label-lg-lh: 1.4; --label-lg-weight: 500;
  --label-md-size: 14px; --label-md-lh: 1.4; --label-md-weight: 500;
  --label-sm-size: 12px; --label-sm-lh: 1.4; --label-sm-weight: 500; --label-sm-ls: 0.025em;
  --label-xs-size: 11px; --label-xs-lh: 1.4; --label-xs-weight: 500; --label-xs-ls: 0.05em;

  /* Caption / Overline */
  --caption-size: 11px; --caption-lh: 1.5; --caption-weight: 400;
  --overline-size:12px; --overline-lh: 1.5; --overline-weight: 600; --overline-ls: 0.1em;

  /* Input */
  --input-md-size: 16px; --input-md-lh: 1.4; --input-md-weight: 400;
  --input-sm-size: 14px; --input-sm-lh: 1.4; --input-sm-weight: 400;

  /* Code */
  --code-md-size: 14px; --code-md-lh: 1.625; --code-md-weight: 400;
  --code-sm-size: 12px; --code-sm-lh: 1.625; --code-sm-weight: 400;

  /* ========================================================
     SPACING (4px base grid)
     ======================================================== */
  --space-0:    0px;
  --space-0_5:  2px;
  --space-1:    4px;
  --space-1_5:  6px;
  --space-2:    8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   20px;
  --space-6:   24px;
  --space-7:   28px;
  --space-8:   32px;
  --space-9:   36px;
  --space-10:  40px;
  --space-12:  48px;
  --space-16:  64px;
  --space-20:  80px;
  --space-24:  96px;

  /* ========================================================
     RADII
     ======================================================== */
  --radius-0:     0px;
  --radius-sm:    2px;
  --radius-md:    4px;
  --radius-lg:    6px;
  --radius-xl:    8px;    /* buttons / inputs default */
  --radius-2xl:  12px;    /* cards */
  --radius-3xl:  16px;
  --radius-full: 9999px;

  /* ========================================================
     SHADOW / ELEVATION
     ======================================================== */
  --shadow-2xs:  0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow-xs:   0 1px 3px 0 rgba(0,0,0,0.10), 0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-sm:   0 4px 6px -1px rgba(0,0,0,0.10), 0 2px 4px -1px rgba(0,0,0,0.06);
  --shadow-md:   0 10px 15px -3px rgba(0,0,0,0.10), 0 4px 6px -2px rgba(0,0,0,0.05);
  --shadow-lg:   0 20px 25px -5px rgba(0,0,0,0.10), 0 10px 10px -5px rgba(0,0,0,0.04);
  --shadow-xl:   0 25px 50px -12px rgba(0,0,0,0.25);
  --shadow-2xl:  0 35px 60px -15px rgba(0,0,0,0.30);
  --shadow-3xl:  0 50px 100px -20px rgba(0,0,0,0.25);
  --shadow-inner: inset 0 2px 4px 0 rgba(0,0,0,0.06);

  /* ========================================================
     MOTION
     ======================================================== */
  --ease:     cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.0, 0, 0.2, 1);
  --ease-in:  cubic-bezier(0.4, 0, 1, 1);
  --dur-fast: 150ms;
  --dur:      200ms;
  --dur-slow: 300ms;
}

/* ============================================================
   Semantic text utilities
   ============================================================ */
.text-display-xl { font: var(--display-xl-weight) var(--display-xl-size)/var(--display-xl-lh) var(--font-display); letter-spacing: var(--display-xl-ls); }
.text-display-lg { font: var(--display-lg-weight) var(--display-lg-size)/var(--display-lg-lh) var(--font-display); letter-spacing: var(--display-lg-ls); }
.text-display-md { font: var(--display-md-weight) var(--display-md-size)/var(--display-md-lh) var(--font-display); letter-spacing: var(--display-md-ls); }
.text-display-sm { font: var(--display-sm-weight) var(--display-sm-size)/var(--display-sm-lh) var(--font-display); letter-spacing: var(--display-sm-ls); }

.text-h1 { font: var(--h1-weight) var(--h1-size)/var(--h1-lh) var(--font-sans); }
.text-h2 { font: var(--h2-weight) var(--h2-size)/var(--h2-lh) var(--font-sans); }
.text-h3 { font: var(--h3-weight) var(--h3-size)/var(--h3-lh) var(--font-sans); }
.text-h4 { font: var(--h4-weight) var(--h4-size)/var(--h4-lh) var(--font-sans); }
.text-h5 { font: var(--h5-weight) var(--h5-size)/var(--h5-lh) var(--font-sans); }
.text-h6 { font: var(--h6-weight) var(--h6-size)/var(--h6-lh) var(--font-sans); }

.text-body-xl { font: var(--body-xl-weight) var(--body-xl-size)/var(--body-xl-lh) var(--font-sans); }
.text-body-lg { font: var(--body-lg-weight) var(--body-lg-size)/var(--body-lg-lh) var(--font-sans); }
.text-body-md { font: var(--body-md-weight) var(--body-md-size)/var(--body-md-lh) var(--font-sans); }
.text-body-sm { font: var(--body-sm-weight) var(--body-sm-size)/var(--body-sm-lh) var(--font-sans); }
.text-body-xs { font: var(--body-xs-weight) var(--body-xs-size)/var(--body-xs-lh) var(--font-sans); }
.text-body-2xs{ font: var(--body-2xs-weight) var(--body-2xs-size)/var(--body-2xs-lh) var(--font-sans); }

.text-label-lg { font: var(--label-lg-weight) var(--label-lg-size)/var(--label-lg-lh) var(--font-sans); }
.text-label-md { font: var(--label-md-weight) var(--label-md-size)/var(--label-md-lh) var(--font-sans); }
.text-label-sm { font: var(--label-sm-weight) var(--label-sm-size)/var(--label-sm-lh) var(--font-sans); letter-spacing: var(--label-sm-ls); }
.text-label-xs { font: var(--label-xs-weight) var(--label-xs-size)/var(--label-xs-lh) var(--font-sans); letter-spacing: var(--label-xs-ls); }

.text-caption  { font: var(--caption-weight) var(--caption-size)/var(--caption-lh) var(--font-sans); }
.text-overline { font: var(--overline-weight) var(--overline-size)/var(--overline-lh) var(--font-sans); letter-spacing: var(--overline-ls); text-transform: uppercase; }

.text-code-md  { font: var(--code-md-weight) var(--code-md-size)/var(--code-md-lh) var(--font-mono); }
.text-code-sm  { font: var(--code-sm-weight) var(--code-sm-size)/var(--code-sm-lh) var(--font-mono); }

/* ============================================================
   Base document setup
   ============================================================ */
html {
  color: var(--fg);
  background: var(--bg);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  margin: 0;
  font: var(--body-md-weight) var(--body-md-size)/var(--body-md-lh) var(--font-sans);
  color: var(--fg);
  background: var(--bg);
}

h1 { margin: 0; font: var(--h1-weight) var(--h1-size)/var(--h1-lh) var(--font-sans); color: var(--fg-strong); }
h2 { margin: 0; font: var(--h2-weight) var(--h2-size)/var(--h2-lh) var(--font-sans); color: var(--fg-strong); }
h3 { margin: 0; font: var(--h3-weight) var(--h3-size)/var(--h3-lh) var(--font-sans); color: var(--fg-strong); }
h4 { margin: 0; font: var(--h4-weight) var(--h4-size)/var(--h4-lh) var(--font-sans); color: var(--fg-strong); }
h5 { margin: 0; font: var(--h5-weight) var(--h5-size)/var(--h5-lh) var(--font-sans); color: var(--fg-strong); }
h6 { margin: 0; font: var(--h6-weight) var(--h6-size)/var(--h6-lh) var(--font-sans); color: var(--fg-strong); }
p  { margin: 0; text-wrap: pretty; }
code, pre { font-family: var(--font-mono); }

@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap");

:root {
  /* Cream palette — option 0 (#FEF9E7) + white */
  --cream-50:  #FFFEF8;
  --cream-100: #FEF9E7;
  --cream-200: #FCF3CF;
  --cream-300: #F9E79F;
  --cream-400: #F4D03F;
  --cream-500: #E8C547;

  --ink-900: #1F1A14;
  --ink-700: #3D342A;
  --ink-500: #6B5E4E;
  --ink-400: #8B7E6C;
  --ink-300: #C8BEB0;
  --ink-200: #E5DED0;
  --ink-100: #F2ECE0;

  --accent-amber: #D97706;
  --accent-olive: #7A8450;
  --accent-rose:  #B56576;
  --accent-sage:  #9DB17C;

  --pos-500: #4F7B49;    /* muted green for income */
  --pos-50:  #E8F0E0;
  --neg-500: #B8563E;    /* terracotta for expense */
  --neg-50:  #F5E6DE;

  /* Handwritten fonts — Kalam for all hand-styled copy, CJK fallbacks get proper handwritten glyphs */
  --font-hand: "Kalam", "Klee One", "Ma Shan Zheng", "Caveat", "Shadows Into Light", cursive;
  --font-hand-body: "Kalam", "Klee One", "Ma Shan Zheng", "Caveat", cursive;
  --font-serif: "Fraunces", "Noto Sans JP", serif;
  --font-num: "Klee One", "Kalam", cursive;
}

/* Japanese locale: prefer Klee One / Yusei Magic */
[lang="ja"] {
  --font-hand: "Klee One", "Kalam", "Yusei Magic", cursive;
  --font-hand-body: "Klee One", "Kalam", cursive;
  --font-num: "Klee One", "Kalam", cursive;
  --font-sans: "Noto Sans JP", sans-serif;
  --font-ui:   "Noto Sans JP", sans-serif;
}

/* Chinese locale: prefer Ma Shan Zheng for hand, Noto Sans SC for body */
[lang="zh"] {
  --font-hand: "Ma Shan Zheng", "Liu Jian Mao Cao", "Kalam", cursive;
  --font-hand-body: "Ma Shan Zheng", "Kalam", cursive;
  --font-num: "Klee One", "Kalam", cursive;
  --font-sans: "Noto Sans SC", "Noto Sans JP", sans-serif;
  --font-ui:   "Noto Sans SC", "Noto Sans JP", sans-serif;
}

/* Full-hand mode: body + UI also switch to handwritten */
[data-handmode="full"] {
  --font-sans: var(--font-hand-body);
  --font-ui:   var(--font-hand-body);
  --font-serif: var(--font-hand);
}

/* Numeric class — applied anywhere we want handwritten digits */
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: 0.2px; }
.num.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: 0.2px; }

/* CJK locales: Fraunces has no CJK glyphs, so .serif heroes fall back to
   sans-serif. Route those headings to the handwritten CJK font instead. */
[lang="ja"] .serif, [lang="zh"] .serif { font-family: var(--font-hand); }

/* Brand-locked (English, always Kalam regardless of locale).
   Use for "MITA Finance", "MITA's notes", and any other immutable copy. */
.brand-hand { font-family: "Kalam", cursive !important; font-weight: 600; }

/* Dark variant */
[data-theme="dark"] {
  --cream-50:  #1A1712;
  --cream-100: #221E17;
  --cream-200: #2B261D;
  --cream-300: #3D3524;
  --cream-400: #5C4F32;
  --cream-500: #7A6B44;

  --ink-900: #F5EFE2;
  --ink-700: #D8CEBA;
  --ink-500: #A89E8A;
  --ink-400: #847B68;
  --ink-300: #4A4338;
  --ink-200: #35302A;
  --ink-100: #2A2620;

  --pos-500: #8FB37E;
  --pos-50:  #2B3426;
  --neg-500: #D88968;
  --neg-50:  #3A2A22;
}

/* Grainy paper texture — subtle */
.paper-bg {
  background:
    radial-gradient(1200px 800px at 80% -10%, rgba(228, 195, 98, 0.18), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(228, 195, 98, 0.10), transparent 60%),
    var(--cream-100);
}
[data-theme="dark"] .paper-bg {
  background:
    radial-gradient(1200px 800px at 80% -10%, rgba(228, 195, 98, 0.08), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(228, 195, 98, 0.04), transparent 60%),
    var(--cream-100);
}

/* Handwritten utility */
.hand { font-family: var(--font-hand); font-weight: 500; }
.hand-body { font-family: var(--font-hand-body); font-weight: 400; }
.serif { font-family: var(--font-serif); }

/* Scrollbars */
.scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
.scroll-thin::-webkit-scrollbar-thumb { background: var(--ink-300); border-radius: 3px; }
.scroll-thin::-webkit-scrollbar-track { background: transparent; }

/* Card */
.card-paper {
  background: var(--cream-50);
  border: 1px solid var(--ink-200);
  border-radius: 14px;
  box-shadow: 0 1px 2px rgba(95, 75, 40, 0.04), 0 8px 24px -12px rgba(95, 75, 40, 0.12);
}
[data-theme="dark"] .card-paper {
  background: var(--cream-200);
  border-color: var(--ink-300);
  box-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.4);
}

/* Underline doodle */
.doodle-underline {
  position: relative; display: inline-block;
}
.doodle-underline::after {
  content: ''; position: absolute; left: -2px; right: -4px; bottom: -8px;
  height: 6px;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 6' preserveAspectRatio='none'><path d='M1,3 Q30,0.5 60,3 T120,3 T180,3 T199,3' stroke='%23E8C547' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>") no-repeat;
  background-size: 100% 100%;
}

/* Focus ring */
*:focus-visible { outline: 2px solid var(--cream-500); outline-offset: 2px; }

/* Pulse for FAB */
@keyframes soft-pulse {
  0%, 100% { box-shadow: 0 8px 24px rgba(217, 119, 6, 0.35), 0 0 0 0 rgba(217, 119, 6, 0.4); }
  50%      { box-shadow: 0 8px 24px rgba(217, 119, 6, 0.35), 0 0 0 12px rgba(217, 119, 6, 0); }
}
.fab-pulse { animation: soft-pulse 2.8s var(--ease) infinite; }

</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
// DesignCanvas.jsx — Figma-ish design canvas wrapper
// Warm gray grid bg + Sections + Artboards + PostIt notes.
// Artboards are reorderable (grip-drag), labels/titles are inline-editable,
// and any artboard can be opened in a fullscreen focus overlay (←/→/Esc).
// State persists to a .design-canvas.state.json sidecar via the host
// bridge. No assets, no deps.
//
// Usage:
//   <DesignCanvas>
//     <DCSection id="onboarding" title="Onboarding" subtitle="First-run variants">
//       <DCArtboard id="a" label="A · Dusk" width={260} height={480}>…</DCArtboard>
//       <DCArtboard id="b" label="B · Minimal" width={260} height={480}>…</DCArtboard>
//     </DCSection>
//   </DesignCanvas>

const DC = {
  bg: '#f0eee9',
  grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)',
  postitBg: '#fef4a8',
  postitText: '#5a4a2a',
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
};

// One-time CSS injection (classes are dc-prefixed so they don't collide with
// the hosted design's own styles).
if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style');
  s.id = 'dc-styles';
  s.textContent = [
    '.dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}',
    '.dc-editable:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}',
    '[data-dc-slot]{transition:transform .18s cubic-bezier(.2,.7,.3,1)}',
    '[data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}',
    '[data-dc-slot].dc-dragging .dc-card{box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 2px #c96442;transform:scale(1.02)}',
    '.dc-card{transition:box-shadow .15s,transform .15s}',
    '.dc-card *{scrollbar-width:none}',
    '.dc-card *::-webkit-scrollbar{display:none}',
    '.dc-labelrow{display:flex;align-items:center;gap:4px;height:24px}',
    '.dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}',
    '.dc-grip:hover{background:rgba(0,0,0,.08)}',
    '.dc-grip:active{cursor:grabbing}',
    '.dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}',
    '.dc-labeltext:hover{background:rgba(0,0,0,.05)}',
    '.dc-expand{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s,background .12s;',
    '  width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;',
    '  background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}',
    '.dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}',
    '[data-dc-slot]:hover .dc-expand{opacity:1}',
  ].join('\n');
  document.head.appendChild(s);
}

const DCCtx = React.createContext(null);

// ─────────────────────────────────────────────────────────────
// DesignCanvas — stateful wrapper around the pan/zoom viewport.
// Owns runtime state (per-section order, renamed titles/labels, focused
// artboard). Order/titles/labels persist to a .design-canvas.state.json
// sidecar next to the HTML. Reads go via plain fetch() so the saved
// arrangement is visible anywhere the HTML + sidecar are served together
// (omelette preview, direct link, downloaded zip). Writes go through the
// host's window.omelette bridge — editing requires the omelette runtime.
// Focus is ephemeral.
// ─────────────────────────────────────────────────────────────
const DC_STATE_FILE = '.design-canvas.state.json';

function DesignCanvas({ children, minScale, maxScale, style }) {
  const [state, setState] = React.useState({ sections: {}, focus: null });
  // Hold rendering until the sidecar read settles so the saved order/titles
  // appear on first paint (no source-order flash). didRead gates writes until
  // the read settles so the empty initial state can't clobber a slow read;
  // skipNextWrite suppresses the one echo-write that would otherwise follow
  // hydration.
  const [ready, setReady] = React.useState(false);
  const didRead = React.useRef(false);
  const skipNextWrite = React.useRef(false);

  React.useEffect(() => {
    let off = false;
    fetch('./' + DC_STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((saved) => {
        if (off || !saved || !saved.sections) return;
        skipNextWrite.current = true;
        setState((s) => ({ ...s, sections: saved.sections }));
      })
      .catch(() => {})
      .finally(() => { didRead.current = true; if (!off) setReady(true); });
    const t = setTimeout(() => { if (!off) setReady(true); }, 150);
    return () => { off = true; clearTimeout(t); };
  }, []);

  React.useEffect(() => {
    if (!didRead.current) return;
    if (skipNextWrite.current) { skipNextWrite.current = false; return; }
    const t = setTimeout(() => {
      window.omelette?.writeFile(DC_STATE_FILE, JSON.stringify({ sections: state.sections })).catch(() => {});
    }, 250);
    return () => clearTimeout(t);
  }, [state.sections]);

  // Build registries synchronously from children so FocusOverlay can read
  // them in the same render. Only direct DCSection > DCArtboard children are
  // walked — wrapping them in other elements opts out of focus/reorder.
  const registry = {};     // slotId -> { sectionId, artboard }
  const sectionMeta = {};  // sectionId -> { title, subtitle, slotIds[] }
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter((k) => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter((k) => !kept.includes(k))],
    };
  });

  const api = React.useMemo(() => ({
    state,
    section: (id) => state.sections[id] || {},
    patchSection: (id, p) => setState((s) => ({
      ...s,
      sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },
    })),
    setFocus: (slotId) => setState((s) => ({ ...s, focus: slotId })),
  }), [state]);

  // Esc exits focus; any outside pointerdown commits an in-progress rename.
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') api.setFocus(null); };
    const onPd = (e) => {
      const ae = document.activeElement;
      if (ae && ae.isContentEditable && !ae.contains(e.target)) ae.blur();
    };
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPd, true);
    return () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('pointerdown', onPd, true);
    };
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale} style={style}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

// ─────────────────────────────────────────────────────────────
// DCViewport — transform-based pan/zoom (internal)
//
// Input mapping (Figma-style):
//   • trackpad pinch  → zoom   (ctrlKey wheel; Safari gesture* events)
//   • trackpad scroll → pan    (two-finger)
//   • mouse wheel     → zoom   (notched; distinguished from trackpad scroll)
//   • middle-drag / primary-drag-on-bg → pan
//
// Transform state lives in a ref and is written straight to the DOM
// (translate3d + will-change) so wheel ticks don't go through React —
// keeps pans at 60fps on dense canvases.
// ─────────────────────────────────────────────────────────────
function DCViewport({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 0, y: 0, scale: 1 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (el) el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;

    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      // keep the world point under the cursor fixed
      t.x = px - (px - t.x) * k;
      t.y = py - (py - t.y) * k;
      t.scale = next;
      apply();
    };

    // Mouse-wheel vs trackpad-scroll heuristic. A physical wheel sends
    // line-mode deltas (Firefox) or large integer pixel deltas with no X
    // component (Chrome/Safari, typically multiples of 100/120). Trackpad
    // two-finger scroll sends small/fractional pixel deltas, often with
    // non-zero deltaX. ctrlKey is set by the browser for trackpad pinch.
    const isMouseWheel = (e) =>
      e.deltaMode !== 0 ||
      (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);

    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return; // Safari: gesture* owns the pinch — discard concurrent wheels
      if (e.ctrlKey) {
        // trackpad pinch (or explicit ctrl+wheel)
        zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      } else if (isMouseWheel(e)) {
        // notched mouse wheel — fixed-ratio step per click
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      } else {
        // trackpad two-finger scroll — pan
        tf.current.x -= e.deltaX;
        tf.current.y -= e.deltaY;
        apply();
      }
    };

    // Safari sends native gesture* events for trackpad pinch with a smooth
    // e.scale; preferring these over the ctrl+wheel fallback gives a much
    // better feel there. No-ops on other browsers. Safari also fires
    // ctrlKey wheel events during the same pinch — isGesturing makes
    // onWheel drop those entirely so they neither zoom nor pan.
    let gsBase = 1;
    let isGesturing = false;
    const onGestureStart = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGestureChange = (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale);
    };
    const onGestureEnd = (e) => { e.preventDefault(); isGesturing = false; };

    // Drag-pan: middle button anywhere, or primary button on canvas
    // background (anything that isn't an artboard or an inline editor).
    let drag = null;
    const onPointerDown = (e) => {
      const onBg = !e.target.closest('[data-dc-slot], .dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault();
      vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
      vp.style.cursor = 'grabbing';
    };
    const onPointerMove = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx;
      tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      apply();
    };
    const onPointerUp = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId);
      drag = null;
      vp.style.cursor = '';
    };

    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGestureStart, { passive: false });
    vp.addEventListener('gesturechange', onGestureChange, { passive: false });
    vp.addEventListener('gestureend', onGestureEnd, { passive: false });
    vp.addEventListener('pointerdown', onPointerDown);
    vp.addEventListener('pointermove', onPointerMove);
    vp.addEventListener('pointerup', onPointerUp);
    vp.addEventListener('pointercancel', onPointerUp);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGestureStart);
      vp.removeEventListener('gesturechange', onGestureChange);
      vp.removeEventListener('gestureend', onGestureEnd);
      vp.removeEventListener('pointerdown', onPointerDown);
      vp.removeEventListener('pointermove', onPointerMove);
      vp.removeEventListener('pointerup', onPointerUp);
      vp.removeEventListener('pointercancel', onPointerUp);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div
      ref={vpRef}
      className="design-canvas"
      style={{
        height: '100vh', width: '100vw',
        background: DC.bg,
        overflow: 'hidden',
        overscrollBehavior: 'none',
        touchAction: 'none',
        position: 'relative',
        fontFamily: DC.font,
        boxSizing: 'border-box',
        ...style,
      }}
    >
      <div
        ref={worldRef}
        style={{
          position: 'absolute', top: 0, left: 0,
          transformOrigin: '0 0',
          willChange: 'transform',
          width: 'max-content', minWidth: '100%',
          minHeight: '100%',
          padding: '60px 0 80px',
        }}
      >
        <div style={{ position: 'absolute', inset: -6000, backgroundImage: gridSvg, backgroundSize: '120px 120px', pointerEvents: 'none', zIndex: -1 }} />
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// DCSection — editable title + h-row of artboards in persisted order
// ─────────────────────────────────────────────────────────────
function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const all = React.Children.toArray(children);
  const artboards = all.filter((c) => c && c.type === DCArtboard);
  const rest = all.filter((c) => !(c && c.type === DCArtboard));
  const srcOrder = artboards.map((a) => a.props.id ?? a.props.label);
  const sec = (ctx && sid && ctx.section(sid)) || {};

  const order = React.useMemo(() => {
    const kept = (sec.order || []).filter((k) => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter((k) => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);

  const byId = Object.fromEntries(artboards.map((a) => [a.props.id ?? a.props.label, a]));

  return (
    <div data-dc-section={sid} style={{ marginBottom: 80, position: 'relative' }}>
      <div style={{ padding: '0 60px 56px' }}>
        <DCEditable tag="div" value={sec.title ?? title}
          onChange={(v) => ctx && sid && ctx.patchSection(sid, { title: v })}
          style={{ fontSize: 28, fontWeight: 600, color: DC.title, letterSpacing: -0.4, marginBottom: 6, display: 'inline-block' }} />
        {subtitle && <div style={{ fontSize: 16, color: DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display: 'flex', gap, padding: '0 60px', alignItems: 'flex-start', width: 'max-content' }}>
        {order.map((k) => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels || {})[k] ?? byId[k].props.label}
            onRename={(v) => ctx && ctx.patchSection(sid, (x) => ({ labels: { ...x.labels, [k]: v } }))}
            onReorder={(next) => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)} />
        ))}
      </div>
      {rest}
    </div>
  );
}

// DCArtboard — marker; rendered by DCArtboardFrame via DCSection.
function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width = 260, height = 480, children, style = {} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = React.useRef(null);

  // Live drag-reorder: dragged card sticks to cursor; siblings slide into
  // their would-be slots in real time via transforms. DOM order only
  // changes on drop.
  const onGripDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    // translateX is applied in local (pre-scale) space but pointer deltas and
    // getBoundingClientRect().left are screen-space — divide by the viewport's
    // current scale so the dragged card tracks the cursor at any zoom level.
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map((el) => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map((h) => h.x);
    const startIdx = order.indexOf(id);
    const startX = e.clientX;
    let liveOrder = order.slice();
    me.classList.add('dc-dragging');

    const layout = () => {
      for (const h of homes) {
        if (h.id === id) continue;
        const slot = liveOrder.indexOf(h.id);
        h.el.style.transform = `translateX(${(slotXs[slot] - h.x) / scale}px)`;
      }
    };

    const move = (ev) => {
      const dx = ev.clientX - startX;
      me.style.transform = `translateX(${dx / scale}px)`;
      const cur = homes[startIdx].x + dx;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) {
        const d = Math.abs(slotXs[i] - cur);
        if (d < best) { best = d; nearest = i; }
      }
      if (liveOrder.indexOf(id) !== nearest) {
        liveOrder = order.filter((k) => k !== id);
        liveOrder.splice(nearest, 0, id);
        layout();
      }
    };

    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging');
      me.style.transform = `translateX(${(slotXs[finalSlot] - homes[startIdx].x) / scale}px)`;
      // After the settle transition, kill transitions + clear transforms +
      // commit the reorder in the same frame so there's no visual snap-back.
      setTimeout(() => {
        for (const h of homes) { h.el.style.transition = 'none'; h.el.style.transform = ''; }
        if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          for (const h of homes) h.el.style.transition = '';
        }));
      }, 180);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  };

  return (
    <div ref={ref} data-dc-slot={id} style={{ position: 'relative', flexShrink: 0 }}>
      <div className="dc-labelrow" style={{ position: 'absolute', bottom: '100%', left: -4, marginBottom: 4, color: DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown} title="Drag to reorder">
          <svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="7" cy="2" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="2" cy="11" r="1.1"/><circle cx="7" cy="11" r="1.1"/></svg>
        </div>
        <div className="dc-labeltext" onClick={onFocus} title="Click to focus">
          <DCEditable value={label} onChange={onRename} onClick={(e) => e.stopPropagation()}
            style={{ fontSize: 15, fontWeight: 500, color: DC.label, lineHeight: 1 }} />
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={(e) => e.stopPropagation()} title="Focus">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card"
        style={{ borderRadius: 2, boxShadow: '0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)', overflow: 'hidden', width, height, background: '#fff', ...style }}>
        {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb', fontSize: 13, fontFamily: DC.font }}>{id}</div>}
      </div>
    </div>
  );
}

// Inline rename — commits on blur or Enter.
function DCEditable({ value, onChange, style, tag = 'span', onClick }) {
  const T = tag;
  return (
    <T className="dc-editable" contentEditable suppressContentEditableWarning
      onClick={onClick}
      onPointerDown={(e) => e.stopPropagation()}
      onBlur={(e) => onChange && onChange(e.currentTarget.textContent)}
      onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}
      style={style}>{value}</T>
  );
}

// ─────────────────────────────────────────────────────────────
// Focus mode — overlay one artboard; ←/→ within section, ↑/↓ across
// sections, Esc or backdrop click to exit.
// ─────────────────────────────────────────────────────────────
function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);

  const go = (d) => { const n = peers[(idx + d + peers.length) % peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const ns = sectionOrder[(secIdx + d + sectionOrder.length) % sectionOrder.length];
    const first = sectionMeta[ns] && sectionMeta[ns].slotIds[0];
    if (first) ctx.setFocus(`${ns}/${first}`);
  };

  React.useEffect(() => {
    const k = (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); goSection(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); goSection(1); }
    };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  });

  const { width = 260, height = 480, children } = artboard.props;
  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => { const r = () => setVp({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', r); return () => window.removeEventListener('resize', r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w - 200) / width, (vp.h - 260) / height, 2));

  const [ddOpen, setDd] = React.useState(false);
  const Arrow = ({ dir, onClick }) => (
    <button onClick={(e) => { e.stopPropagation(); onClick(); }}
      style={{ position: 'absolute', top: '50%', [dir]: 28, transform: 'translateY(-50%)',
        border: 'none', background: 'rgba(255,255,255,.08)', color: 'rgba(255,255,255,.9)',
        width: 44, height: 44, borderRadius: 22, fontSize: 18, cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .15s' }}
      onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.18)')}
      onMouseLeave={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.08)')}>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d={dir === 'left' ? 'M11 3L5 9l6 6' : 'M7 3l6 6-6 6'} /></svg>
    </button>
  );

  // Portal to body so position:fixed is the real viewport regardless of any
  // transform on DesignCanvas's ancestors (including the canvas zoom itself).
  return ReactDOM.createPortal(
    <div onClick={() => ctx.setFocus(null)}
      onWheel={(e) => e.preventDefault()}
      style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(24,20,16,.6)', backdropFilter: 'blur(14px)',
        fontFamily: DC.font, color: '#fff' }}>

      {/* top bar: section dropdown (left) · close (right) */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 72, display: 'flex', alignItems: 'flex-start', padding: '16px 20px 0', gap: 16 }}>
        <div style={{ position: 'relative' }}>
          <button onClick={() => setDd((o) => !o)}
            style={{ border: 'none', background: 'transparent', color: '#fff', cursor: 'pointer', padding: '6px 8px',
              borderRadius: 6, textAlign: 'left', fontFamily: 'inherit' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 18, fontWeight: 600, letterSpacing: -0.3 }}>{meta.title}</span>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{ opacity: .7 }}><path d="M2 4l3.5 3.5L9 4"/></svg>
            </span>
            {meta.subtitle && <span style={{ display: 'block', fontSize: 13, opacity: .6, fontWeight: 400, marginTop: 2 }}>{meta.subtitle}</span>}
          </button>
          {ddOpen && (
            <div style={{ position: 'absolute', top: '100%', left: 0, marginTop: 4, background: '#2a251f', borderRadius: 8,
              boxShadow: '0 8px 32px rgba(0,0,0,.4)', padding: 4, minWidth: 200, zIndex: 10 }}>
              {sectionOrder.map((sid) => (
                <button key={sid} onClick={() => { setDd(false); const f = sectionMeta[sid].slotIds[0]; if (f) ctx.setFocus(`${sid}/${f}`); }}
                  style={{ display: 'block', width: '100%', textAlign: 'left', border: 'none', cursor: 'pointer',
                    background: sid === sectionId ? 'rgba(255,255,255,.1)' : 'transparent', color: '#fff',
                    padding: '8px 12px', borderRadius: 5, fontSize: 14, fontWeight: sid === sectionId ? 600 : 400, fontFamily: 'inherit' }}>
                  {sectionMeta[sid].title}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={() => ctx.setFocus(null)}
          onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.12)')}
          onMouseLeave={(e) => (e.currentTarget.style.background = 'transparent')}
          style={{ border: 'none', background: 'transparent', color: 'rgba(255,255,255,.7)', width: 32, height: 32,
            borderRadius: 16, fontSize: 20, cursor: 'pointer', lineHeight: 1, transition: 'background .12s' }}>×</button>
      </div>

      {/* card centered, label + index below — only the card itself stops
          propagation so any backdrop click (including the margins around
          the card) exits focus */}
      <div
        style={{ position: 'absolute', top: 64, bottom: 56, left: 100, right: 100, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
        <div onClick={(e) => e.stopPropagation()} style={{ width: width * scale, height: height * scale, position: 'relative' }}>
          <div style={{ width, height, transform: `scale(${scale})`, transformOrigin: 'top left', background: '#fff', borderRadius: 2, overflow: 'hidden',
            boxShadow: '0 20px 80px rgba(0,0,0,.4)' }}>
            {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb' }}>{aid}</div>}
          </div>
        </div>
        <div onClick={(e) => e.stopPropagation()} style={{ fontSize: 14, fontWeight: 500, opacity: .85, textAlign: 'center' }}>
          {(sec.labels || {})[aid] ?? artboard.props.label}
          <span style={{ opacity: .5, marginLeft: 10, fontVariantNumeric: 'tabular-nums' }}>{idx + 1} / {peers.length}</span>
        </div>
      </div>

      <Arrow dir="left" onClick={() => go(-1)} />
      <Arrow dir="right" onClick={() => go(1)} />

      {/* dots */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 8 }}>
        {peers.map((p, i) => (
          <button key={p} onClick={() => ctx.setFocus(`${sectionId}/${p}`)}
            style={{ border: 'none', padding: 0, cursor: 'pointer', width: 6, height: 6, borderRadius: 3,
              background: i === idx ? '#fff' : 'rgba(255,255,255,.3)' }} />
        ))}
      </div>
    </div>,
    document.body,
  );
}

// ─────────────────────────────────────────────────────────────
// Post-it — absolute-positioned sticky note
// ─────────────────────────────────────────────────────────────
function DCPostIt({ children, top, left, right, bottom, rotate = -2, width = 180 }) {
  return (
    <div style={{
      position: 'absolute', top, left, right, bottom, width,
      background: DC.postitBg, padding: '14px 16px',
      fontFamily: '"Comic Sans MS", "Marker Felt", "Segoe Print", cursive',
      fontSize: 14, lineHeight: 1.4, color: DC.postitText,
      boxShadow: '0 2px 8px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08)',
      transform: `rotate(${rotate}deg)`,
      zIndex: 5,
    }}>{children}</div>
  );
}

Object.assign(window, { DesignCanvas, DCSection, DCArtboard, DCPostIt });

</script>

const I18NContext = React.createContext({ lang: 'en', name: '', t: (k) => I18N.en[k] || k });
function useT() { return React.useContext(I18NContext); }
// Interpolate {name} etc. Pass vars as 2nd arg: t('greet_afternoon', { name: 'Lena' })
function I18NProvider({ lang, name, children }) {
  const dict = I18N[lang] || I18N.en;
  const t = React.useCallback((k, vars) => {
    const raw = dict[k] || I18N.en[k] || k;
    const merged = { name: name || '', ...(vars || {}) };
    return raw.replace(/\{(\w+)\}/g, (_, key) => (merged[key] != null ? merged[key] : `{${key}}`));
  }, [dict, name]);
  return <I18NContext.Provider value={{ lang, name, t }}>{children}</I18NContext.Provider>;
}

const FX = { USD: 1, CNY: 7.12, JPY: 156.4, EUR: 0.92 };
const SYM = { USD: '$', CNY: '¥', JPY: '¥', EUR: '€' };
function fmtMoney(usd, currency = 'USD', opts = {}) {
  const v = usd * (FX[currency] || 1);
  const fractionDigits = currency === 'JPY' ? 0 : (opts.fractionDigits ?? 2);
  const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: fractionDigits, maximumFractionDigits: fractionDigits });
  return `${v < 0 ? '−' : ''}${SYM[currency] || ''}${s}`;
}

<script type="text/babel" data-presets="react">// Hand-drawn style charts. All SVG.
// Rough-ish stroke feel via filters + slight jitter; no libraries.

function roughJitter(points, amp = 0.6) {
  // Add tiny deterministic jitter so strokes don't look machine-perfect.
  return points.map(([x, y], i) => {
    const j = Math.sin(i * 12.9898) * 43758.5453 % 1;
    return [x + (j - 0.5) * amp * 2, y + (Math.cos(i * 7.1) * amp)];
  });
}

function LineChart({ data, width = 520, height = 180, currency = 'USD', theme = 'light' }) {
  const pad = { t: 20, r: 18, b: 28, l: 40 };
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const maxE = Math.max(...data.map(d => d.expense), 100);
  const maxI = Math.max(...data.map(d => d.income), 100);
  const maxY = Math.max(maxE, maxI) * 1.1;

  const toX = i => pad.l + (i / (data.length - 1)) * w;
  const toY = v => pad.t + h - (v / maxY) * h;

  const expPts = roughJitter(data.map((d, i) => [toX(i), toY(d.expense)]), 0.4);
  const incPts = roughJitter(data.map((d, i) => [toX(i), toY(d.income)]), 0.4);

  const path = pts => pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const areaPath = pts => path(pts) + ` L${pts[pts.length - 1][0]},${pad.t + h} L${pts[0][0]},${pad.t + h} Z`;

  const gridYs = [0, 0.25, 0.5, 0.75, 1].map(f => pad.t + h - f * h);
  const sym = SYM[currency] || '$';

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} style={{ overflow: 'visible' }}>
      <defs>
        <linearGradient id="expFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--neg-500)" stopOpacity="0.22" />
          <stop offset="100%" stopColor="var(--neg-500)" stopOpacity="0.02" />
        </linearGradient>
        <linearGradient id="incFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--pos-500)" stopOpacity="0.22" />
          <stop offset="100%" stopColor="var(--pos-500)" stopOpacity="0.02" />
        </linearGradient>
      </defs>
      {/* grid */}
      {gridYs.map((y, i) => (
        <g key={i}>
          <line x1={pad.l} x2={pad.l + w} y1={y} y2={y} stroke="var(--ink-200)" strokeWidth="1" strokeDasharray={i === gridYs.length - 1 ? '' : '3 4'} />
          <text x={pad.l - 8} y={y + 3} fontSize="10" textAnchor="end" fill="var(--ink-400)" fontFamily="var(--font-ui)">
            {sym}{Math.round((maxY * (1 - i * 0.25)) * (FX[currency] || 1))}
          </text>
        </g>
      ))}
      {/* X axis ticks */}
      {data.filter((_, i) => i % Math.ceil(data.length / 6) === 0).map((d, i, arr) => {
        const idx = data.indexOf(d);
        return (
          <text key={idx} x={toX(idx)} y={pad.t + h + 16} fontSize="10" textAnchor="middle" fill="var(--ink-400)" fontFamily="var(--font-ui)">
            {d.day !== undefined ? d.day : d.m}
          </text>
        );
      })}
      {/* expense area + line */}
      <path d={areaPath(expPts)} fill="url(#expFill)" />
      <path d={path(expPts)} fill="none" stroke="var(--neg-500)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
      {/* income area + line */}
      <path d={areaPath(incPts)} fill="url(#incFill)" />
      <path d={path(incPts)} fill="none" stroke="var(--pos-500)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="0" />
      {/* highlight spike points */}
      {incPts.map((p, i) => data[i].income > 0 && (
        <circle key={i} cx={p[0]} cy={p[1]} r="3" fill="var(--cream-50)" stroke="var(--pos-500)" strokeWidth="1.5" />
      ))}
    </svg>
  );
}

function BarChart({ data, width = 520, height = 180, currency = 'USD' }) {
  const pad = { t: 16, r: 14, b: 28, l: 44 };
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const maxY = Math.max(...data.map(d => Math.max(d.expense, d.income))) * 1.1;
  const group = w / data.length;
  const barW = Math.min(14, (group - 8) / 2);
  const toY = v => pad.t + h - (v / maxY) * h;
  const sym = SYM[currency] || '$';

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} style={{ overflow: 'visible' }}>
      {[0, 0.25, 0.5, 0.75, 1].map((f, i) => {
        const y = pad.t + h - f * h;
        return (
          <g key={i}>
            <line x1={pad.l} x2={pad.l + w} y1={y} y2={y} stroke="var(--ink-200)" strokeWidth="1" strokeDasharray={f === 0 ? '' : '3 4'} />
            <text x={pad.l - 8} y={y + 3} fontSize="10" textAnchor="end" fill="var(--ink-400)" fontFamily="var(--font-ui)">
              {sym}{Math.round(maxY * f * (FX[currency] || 1) / 1000)}k
            </text>
          </g>
        );
      })}
      {data.map((d, i) => {
        const gx = pad.l + i * group + group / 2;
        const eY = toY(d.expense), iY = toY(d.income);
        return (
          <g key={i}>
            <rect x={gx - barW - 2} y={iY} width={barW} height={pad.t + h - iY}
              fill="var(--pos-500)" opacity="0.85" rx="2" />
            <rect x={gx + 2} y={eY} width={barW} height={pad.t + h - eY}
              fill="var(--neg-500)" opacity="0.85" rx="2" />
            <text x={gx} y={pad.t + h + 16} fontSize="10" textAnchor="middle" fill="var(--ink-400)" fontFamily="var(--font-ui)">
              {d.m}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// Donut for category breakdown
function DonutChart({ data, size = 160, innerRatio = 0.62, currency = 'USD' }) {
  const cx = size / 2, cy = size / 2;
  const r = size / 2 - 6;
  const ir = r * innerRatio;
  const total = data.reduce((a, d) => a + d.amt, 0);
  let ang = -Math.PI / 2;
  const sym = SYM[currency] || '$';

  const slices = data.map(d => {
    const frac = d.amt / total;
    const a0 = ang, a1 = ang + frac * Math.PI * 2;
    ang = a1;
    const large = frac > 0.5 ? 1 : 0;
    const x0 = cx + Math.cos(a0) * r, y0 = cy + Math.sin(a0) * r;
    const x1 = cx + Math.cos(a1) * r, y1 = cy + Math.sin(a1) * r;
    const xi1 = cx + Math.cos(a1) * ir, yi1 = cy + Math.sin(a1) * ir;
    const xi0 = cx + Math.cos(a0) * ir, yi0 = cy + Math.sin(a0) * ir;
    return {
      d: `M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${xi1},${yi1} A${ir},${ir} 0 ${large} 0 ${xi0},${yi0} Z`,
      fill: (CAT_COLORS[d.cat] || CAT_COLORS.Other).dot,
      cat: d.cat, pct: d.pct, amt: d.amt,
    };
  });

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {slices.map((s, i) => <path key={i} d={s.d} fill={s.fill} stroke="var(--cream-50)" strokeWidth="2" />)}
      <text x={cx} y={cy - 4} textAnchor="middle" fontSize="11" fill="var(--ink-500)" fontFamily="var(--font-ui)">This month</text>
      <text x={cx} y={cy + 14} textAnchor="middle" fontSize="18" fontWeight="700" fill="var(--ink-900)" fontFamily="var(--font-sans)">
        {sym}{Math.round(total * (FX[currency] || 1)).toLocaleString()}
      </text>
    </svg>
  );
}

Object.assign(window, { LineChart, BarChart, DonutChart });
</script>

  const options = [
    { id: 'en', label: 'English',  short: 'EN' },
    { id: 'ja', label: '日本語',    short: 'JA' },
    { id: 'zh', label: '中文',      short: '中' },
  ];
  const cur = options.find(o => o.id === value) || options[0];
  React.useEffect(() => {
    if (!open) return;
    const close = () => setOpen(false);
    window.addEventListener('click', close);
    return () => window.removeEventListener('click', close);
  }, [open]);
  return (
    <div style={{ position: 'relative' }} onClick={e => e.stopPropagation()}>
      <button onClick={() => setOpen(o => !o)} style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        height: 32, padding: '0 10px', borderRadius: 8,
        border: '1px solid var(--ink-200)', background: 'var(--cream-50)',
        color: 'var(--ink-900)', fontSize: 12, fontWeight: 600,
        fontFamily: 'var(--font-ui)', cursor: 'pointer',
      }}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        {cur.short}
        <Icon name="chevron-down" size={12} />
      </button>
      {open && (
        <div style={{
          position: 'absolute', top: '100%', right: 0, marginTop: 4,
          background: 'var(--cream-50)', border: '1px solid var(--ink-200)',
          borderRadius: 9, boxShadow: '0 10px 30px rgba(0,0,0,.12)',
          padding: 4, minWidth: 150, zIndex: 20,
        }}>
          {options.map(o => {
            const on = value === o.id;
            return (
              <button key={o.id} onClick={() => { onChange(o.id); setOpen(false); }} style={{
                display: 'flex', alignItems: 'center', gap: 10, width: '100%',
                padding: '7px 10px', border: 'none', borderRadius: 6,
                background: on ? 'var(--cream-200)' : 'transparent',
                color: 'var(--ink-900)', fontSize: 12.5, fontFamily: 'var(--font-ui)',
                fontWeight: on ? 700 : 400,
                cursor: 'pointer', textAlign: 'left',
              }}>
                <span style={{ color: 'var(--ink-500)', width: 20, fontWeight: on ? 700 : 500 }}>{o.short}</span>
                <span style={{ flex: 1 }}>{o.label}</span>
                {on && <Icon name="check" size={12} />}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function CurrencyPicker({ value, onChange }) {

  return (
    <div style={{ position: 'relative' }}>

        fontFamily: 'var(--font-ui)', cursor: 'pointer',
      }}>
        <span style={{ color: 'var(--ink-500)' }}>{SYM[value]}</span>

          borderRadius: 9, boxShadow: '0 10px 30px rgba(0,0,0,.12)',

          {options.map(o => {
            const on = value === o;

              <button key={o} onClick={() => { onChange(o); setOpen(false); }} style={{

                cursor: 'pointer', textAlign: 'left',
              }}>
                <span style={{ color: 'var(--ink-500)', width: 14, fontWeight: on ? 700 : 500 }}>{SYM[o]}</span>{o}

              </button>

      )}

}

// ─── Chatbot FAB + panel ─────────────────────────────────
function ChatbotFab({ open, onOpen }) {

function ChatbotPanel({ open, onClose, currency }) {
  const [input, setInput] = React.useState('');
  const [msgs, setMsgs] = React.useState([
    { role: 'agent', text: "Hi! I'm MITA, your finance agent. I watch your spending and nudge you toward your goals. Ask me anything." },
    { role: 'agent', text: "Quick takes on this month:", chips: ['Show my top categories', 'Can I afford a $600 trip?', 'Set a coffee budget', 'Where am I bleeding cash?'] },
  ]);
  const [typing, setTyping] = React.useState(false);

  const send = (text) => {
    if (!text.trim()) return;
    setMsgs(m => [...m, { role: 'user', text }]);
    setInput('');
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      setMsgs(m => [...m, {
        role: 'agent',
        text: "Based on the last 30 days: Food is your biggest discretionary category ($412). If you cap eating out at $250/mo you'd save ~$160/mo — enough to cover that trip in under 4 months.",
        card: { label: 'Projected savings', value: 640, sub: 'next 4 months · at current rate' },
      }]);
    }, 900);
  };

  if (!open) return null;
  return (
    <div style={{
      position: 'absolute', bottom: 24, right: 24, zIndex: 31,
      width: 380, height: 520,
      background: 'var(--cream-50)', border: '1px solid var(--ink-200)',
      borderRadius: 16, boxShadow: '0 24px 60px -10px rgba(70,50,20,.35)',

    }}>
      <style>{`@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}`}</style>
      {/* header */}
      <div style={{
        padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 10,
        background: 'linear-gradient(180deg, var(--cream-200), var(--cream-100))',
        borderBottom: '1px solid var(--ink-200)',
      }}>
        <div style={{
          width: 34, height: 34, borderRadius: 17,
          background: 'linear-gradient(135deg, #F4C430, #D97706)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: '#fff', fontFamily: 'var(--font-hand)', fontSize: 18, fontWeight: 700,
        }}>M</div>
        <div style={{ lineHeight: 1.2 }}>
          <div className="brand-hand" style={{ fontSize: 18, fontWeight: 700, color: 'var(--ink-900)' }}>MITA agent</div>
          <div style={{ fontSize: 10.5, color: 'var(--ink-500)', display: 'flex', alignItems: 'center', gap: 5 }}>
            <span style={{ width: 6, height: 6, borderRadius: 3, background: 'var(--pos-500)' }}/>
            Watching · 247 records this month
          </div>
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={onClose} style={{ border: 'none', background: 'transparent', cursor: 'pointer', width: 28, height: 28, borderRadius: 6, color: 'var(--ink-500)' }}>
          <Icon name="x" size={15} />
        </button>
      </div>

      {/* messages */}
      <div className="scroll-thin" style={{ flex: 1, overflow: 'auto', padding: '14px 12px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {msgs.map((m, i) => (
          <div key={i} style={{ alignSelf: m.role === 'user' ? 'flex-end' : 'flex-start', maxWidth: '86%' }}>
            <div style={{
              padding: '9px 13px', borderRadius: m.role === 'user' ? '14px 14px 3px 14px' : '14px 14px 14px 3px',
              background: m.role === 'user' ? 'var(--ink-900)' : 'var(--cream-200)',
              color: m.role === 'user' ? 'var(--cream-50)' : 'var(--ink-900)',
              fontSize: 13, lineHeight: 1.55, fontFamily: 'var(--font-sans)',
            }}>{m.text}</div>
            {m.card && (
              <div style={{ marginTop: 6, padding: 12, borderRadius: 10, background: 'var(--cream-100)', border: '1px dashed var(--cream-400)' }}>
                <div style={{ fontSize: 10.5, color: 'var(--ink-500)', textTransform: 'uppercase', letterSpacing: 0.8 }}>{m.card.label}</div>
                <div className="hand" style={{ fontSize: 26, fontWeight: 700, color: 'var(--pos-500)' }}>+{fmtMoney(m.card.value, currency)}</div>
                <div style={{ fontSize: 11, color: 'var(--ink-500)' }}>{m.card.sub}</div>
              </div>
            )}
            {m.chips && (
              <div style={{ marginTop: 8, display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                {m.chips.map(c => (
                  <button key={c} onClick={() => send(c)} style={{
                    padding: '5px 10px', borderRadius: 9999,
                    background: 'var(--cream-50)', border: '1px solid var(--ink-200)',
                    color: 'var(--ink-700)', fontSize: 11.5, cursor: 'pointer', fontFamily: 'var(--font-sans)',
                  }}>{c}</button>
                ))}
              </div>
            )}
          </div>
        ))}
        {typing && (
          <div style={{ alignSelf: 'flex-start' }}>
            <div style={{ padding: '9px 13px', borderRadius: '14px 14px 14px 3px', background: 'var(--cream-200)', display: 'flex', gap: 4 }}>
              {[0, 1, 2].map(i => <span key={i} style={{
                width: 6, height: 6, borderRadius: 3, background: 'var(--ink-400)',
                animation: `bounce 1.2s ${i * 0.15}s infinite`,
              }}/>)}
              <style>{`@keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}`}</style>
            </div>
          </div>
        )}

      {/* input */}
      <div style={{ padding: 10, borderTop: '1px solid var(--ink-200)', display: 'flex', gap: 6 }}>
        <input value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && send(input)}
          placeholder="Ask MITA…"
          style={{
            flex: 1, height: 36, padding: '0 12px', borderRadius: 10,
            border: '1px solid var(--ink-200)', background: 'var(--cream-50)',
            fontSize: 13, fontFamily: 'var(--font-sans)', color: 'var(--ink-900)', outline: 'none',
          }}/>
        <button onClick={() => send(input)} style={{
          width: 36, height: 36, borderRadius: 10, border: 'none',
          background: 'var(--ink-900)', color: 'var(--cream-50)', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <Icon name="arrow-up" size={15} />
        </button>
      </div>
    </div>
  );
}

Object.assign(window, { LeftSidebar, TopBar, IconBtn, SegmentedToggle, LanguagePicker, CurrencyPicker, ChatbotFab, ChatbotPanel });

<script type="text/babel" data-presets="react">// Variant A — "Classic": clean, info-dense, printed-journal feel
// Layout: big summary row · line chart · bar chart · insights · recent txns

function DashboardA({ currency }) {
  const { t, lang } = useT();
  const monthE = SAMPLE.daily.reduce((a, d) => a + d.expense, 0);
  const monthI = SAMPLE.daily.reduce((a, d) => a + d.income, 0);
  const net = monthI - monthE;

  const today = { en: 'Tuesday, April 21', ja: '4月21日(火)', zh: '4月21日 · 星期二' }[lang];
  const shaping = { en: "Here's how April is shaping up \u2014 9 days left.", ja: '4月の進み具合 \u2014 残り9日。', zh: '四月还剩 9 天，进度如图。' }[lang];
  const balance = { en: 'Balance', ja: '残高', zh: '余额' }[lang];
  const incomeApr = { en: 'Income (Apr)', ja: '収入(4月)', zh: '收入(4月)' }[lang];
  const expenseApr = { en: 'Expense (Apr)', ja: '支出(4月)', zh: '支出(4月)' }[lang];
  const netL = { en: 'Net', ja: '収支', zh: '净额' }[lang];
  const across = { en: 'across 3 accounts', ja: '3口座合計', zh: '3 个账户合计' }[lang];
  const payrolls = { en: '2 payrolls + 1 refund', ja: '給与2件 + 返金1件', zh: '2 笔工资 + 1 笔退款' }[lang];
  const txns247 = { en: '247 transactions', ja: '247件', zh: '247 笔交易' }[lang];
  const savingRate = { en: 'saving rate 32%', ja: '貯蓄率 32%', zh: '储蓄率 32%' }[lang];
  const goal25 = { en: 'goal: 25%', ja: '目標: 25%', zh: '目标: 25%' }[lang];
  const onTrack = { en: 'on track', ja: '順調', zh: '达标' }[lang];
  const vsMar = { en: '\u221212% vs. Mar', ja: '\u221212% (3月比)', zh: '环比 \u221212%' }[lang];
  const trendVs = { en: '+2.1%', ja: '+2.1%', zh: '+2.1%' }[lang];
  const daily = { en: 'Daily flow', ja: '日次の収支', zh: '每日收支' }[lang];
  const range = { en: 'Apr 1 \u2013 30', ja: '4月1日 \u2013 30日', zh: '4月1日 \u2013 30日' }[lang];
  const expL = { en: 'Expense', ja: '支出', zh: '支出' }[lang];
  const incL = { en: 'Income',  ja: '収入', zh: '收入' }[lang];
  const cats = { en: 'Categories', ja: 'カテゴリ', zh: '分类占比' }[lang];
  const thisMo = { en: 'this month', ja: '今月', zh: '本月' }[lang];
  const trend12 = { en: '12-month trend', ja: '12ヶ月の推移', zh: '近 12 个月走势' }[lang];
  const expVsInc = { en: 'Expense vs. Income', ja: '支出 vs 収入', zh: '支出 vs 收入' }[lang];
  const day = { en: 'Day', ja: '日', zh: '日' }[lang];
  const week = { en: 'Week', ja: '週', zh: '周' }[lang];
  const bar = { en: 'Bar', ja: '棒', zh: '柱状' }[lang];
  const stacked = { en: 'Stacked', ja: '積み上げ', zh: '堆叠' }[lang];
  const autoExtracted = { en: 'Auto-extracted from screenshots + bank sync', ja: 'スクリーンショット + 銀行連携から自動抽出', zh: '由截图 + 银行同步自动提取' }[lang];
  const viewAll = { en: 'View all', ja: 'すべて見る', zh: '查看全部' }[lang];

  return (
    <div className="scroll-thin" style={{ flex: 1, overflow: 'auto', padding: '20px 24px 120px' }}>
      {/* Hero greeting */}
      <div style={{ marginBottom: 20, display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 20 }}>
        <div>
          <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.2, color: 'var(--ink-500)', marginBottom: 4 }}>
            {today}
          </div>
          <h1 className="hand" style={{ fontSize: 32, fontWeight: 700, color: 'var(--ink-900)', letterSpacing: -0.3 }}>
            {t('greet_afternoon')} <span className="hand" style={{ fontSize: 32, color: 'var(--accent-amber)' }}>✦</span>
          </h1>
          <div style={{ fontSize: 13, color: 'var(--ink-500)', marginTop: 3 }}>
            {shaping}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <APButton variant="outline" size="md" icon="refresh-ccw">{t('sync')}</APButton>
          <APButton variant="primary" size="md" icon="plus">{t('add_record')}</APButton>
        </div>
      </div>

      {/* KPI row */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 14, marginBottom: 18 }}>
        <KpiCard label={balance} value={fmtMoney(8420.33, currency)} trend={trendVs} tone="neutral" sub={across} />
        <KpiCard label={incomeApr} value={fmtMoney(monthI, currency)} trend={onTrack} tone="good" sub={payrolls} />
        <KpiCard label={expenseApr} value={fmtMoney(monthE, currency)} trend={vsMar} tone="good" sub={txns247} />
        <KpiCard label={netL} value={fmtMoney(net, currency)} trend={savingRate} tone="good" sub={goal25} highlight />
      </div>

      {/* Charts row */}
      <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr', gap: 14, marginBottom: 18 }}>
        <PaperCard>
          <ChartHeader title={daily} sub={range} tabs={[day, week]} />
          <LineChart data={SAMPLE.daily} currency={currency} height={200} />
          <ChartLegend items={[
            { label: expL, color: 'var(--neg-500)' },
            { label: incL, color: 'var(--pos-500)' },
          ]}/>
        </PaperCard>

        <PaperCard>
          <ChartHeader title={cats} sub={thisMo} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <DonutChart data={SAMPLE.categoryBreakdown} currency={currency} size={150} />
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 7 }}>
              {SAMPLE.categoryBreakdown.map(c => (
                <div key={c.cat} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 4, background: CAT_COLORS[c.cat].dot }}/>
                  <span style={{ flex: 1, color: 'var(--ink-700)' }}>{c.cat}</span>
                  <span style={{ color: 'var(--ink-500)', fontVariantNumeric: 'tabular-nums' }}>{c.pct}%</span>
                </div>
              ))}
            </div>
          </div>
        </PaperCard>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr', gap: 14, marginBottom: 18 }}>
        <PaperCard>
          <ChartHeader title={trend12} sub={expVsInc} tabs={[bar, stacked]} />
          <BarChart data={SAMPLE.monthly} currency={currency} height={200} />
        </PaperCard>

        <PaperCard padding={0}>
          <div style={{ padding: '18px 20px 10px', borderBottom: '1px solid var(--ink-200)', display: 'flex', alignItems: 'center', gap: 8 }}>
            <div className="brand-hand" style={{ fontSize: 22, color: 'var(--ink-900)', letterSpacing: -0.3 }}>MITA's notes</div>
            <span style={{ fontSize: 11, padding: '2px 7px', borderRadius: 6, background: 'var(--cream-200)', color: 'var(--ink-500)' }}>4 {t('insights')}</span>
          </div>
          <div style={{ padding: '8px 10px', display: 'flex', flexDirection: 'column', gap: 4, maxHeight: 240, overflow: 'auto' }} className="scroll-thin">
            {SAMPLE.insights.map(it => <InsightRow key={it.id} insight={it} />)}
          </div>
        </PaperCard>
      </div>

      {/* Recent transactions */}
      <PaperCard padding={0}>
        <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--ink-200)', display: 'flex', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink-900)' }}>{t('recent_records')}</div>
            <div style={{ fontSize: 11.5, color: 'var(--ink-500)' }}>{autoExtracted}</div>
          </div>
          <div style={{ flex: 1 }} />
          <APButton variant="ghost" size="sm" iconRight="arrow-right">{viewAll}</APButton>
        </div>
        <TxnTable rows={SAMPLE.transactions.slice(0, 7)} currency={currency} />
      </PaperCard>
    </div>
  );
}

function KpiCard({ label, value, trend, sub, tone = 'neutral', highlight }) {
  const toneColor = tone === 'good' ? 'var(--pos-500)' : tone === 'bad' ? 'var(--neg-500)' : 'var(--ink-500)';
  return (
    <PaperCard style={highlight ? { background: 'linear-gradient(160deg, var(--cream-200), var(--cream-100))', borderColor: 'var(--cream-400)' } : {}}>
      <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: 0.9, color: 'var(--ink-500)', fontWeight: 600 }}>{label}</div>
      <div className="serif num" style={{ fontSize: 26, fontWeight: 500, color: 'var(--ink-900)', marginTop: 4, letterSpacing: -0.5, fontVariantNumeric: 'tabular-nums' }}>{value}</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 8, fontSize: 11.5 }}>
        <span style={{ color: toneColor, fontWeight: 600 }}>{trend}</span>
        <span style={{ color: 'var(--ink-400)' }}>· {sub}</span>
      </div>
    </PaperCard>
  );
}

function ChartHeader({ title, sub, tabs }) {
  const [active, setActive] = React.useState(tabs ? tabs[0] : null);
  return (
    <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12, gap: 10 }}>
      <div>
        <div style={{ fontSize: 14.5, fontWeight: 600, color: 'var(--ink-900)' }}>{title}</div>
        {sub && <div style={{ fontSize: 11, color: 'var(--ink-500)' }}>{sub}</div>}
      </div>
      <div style={{ flex: 1 }} />
      {tabs && (
        <SegmentedToggle
          options={tabs.map(t => ({ id: t, label: t }))}
          value={active} onChange={setActive} />
      )}
    </div>
  );
}

function ChartLegend({ items }) {
  return (
    <div style={{ display: 'flex', gap: 14, marginTop: 4 }}>
      {items.map(it => (
        <div key={it.label} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11.5, color: 'var(--ink-500)' }}>
          <span style={{ width: 10, height: 2, borderRadius: 1, background: it.color }} />
          {it.label}
        </div>
      ))}
    </div>
  );
}

function InsightRow({ insight }) {
  const toneBg = { warn: 'var(--neg-50)', good: 'var(--pos-50)', info: 'var(--cream-200)' }[insight.tone];
  const toneIcon = { warn: 'triangle-alert', good: 'check', info: 'sparkles' }[insight.tone];
  const toneColor = { warn: 'var(--neg-500)', good: 'var(--pos-500)', info: 'var(--accent-amber)' }[insight.tone];
  return (
    <div style={{ display: 'flex', gap: 10, padding: 10, borderRadius: 9, alignItems: 'flex-start' }}

function SparkKpi({ label, value, delta, deltaTone, spark }) {
  const max = Math.max(...spark), min = Math.min(...spark);
  const w = 90, h = 28;
  const path = spark.map((v, i) => `${i === 0 ? 'M' : 'L'}${(i / (spark.length - 1)) * w},${h - ((v - min) / (max - min || 1)) * h}`).join(' ');
  const tc = deltaTone === 'good' ? 'var(--pos-500)' : deltaTone === 'bad' ? 'var(--neg-500)' : 'var(--ink-500)';
  return (
    <PaperCard padding={14}>
      <div style={{ fontSize: 10.5, textTransform: 'uppercase', letterSpacing: 0.8, color: 'var(--ink-500)', fontWeight: 600 }}>{label}</div>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 10, marginTop: 4 }}>
        <div className="serif" style={{ fontSize: 22, fontWeight: 500, color: 'var(--ink-900)', fontVariantNumeric: 'tabular-nums', letterSpacing: -0.5, lineHeight: 1 }}>{value}</div>
        <div style={{ flex: 1 }} />
        <svg width={w} height={h} style={{ flexShrink: 0 }}>
          <path d={path} fill="none" stroke={tc} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
          <path d={`${path} L${w},${h} L0,${h} Z`} fill={tc} opacity="0.12"/>
        </svg>
      </div>
      <div style={{ fontSize: 11, color: tc, fontWeight: 600, marginTop: 4 }}>{delta}</div>
    </PaperCard>
  );
}

function GoalCard({ emoji, title, current, target, currency, due }) {

// Minimal inline sparkline
function Spark({ data, stroke = 'var(--accent-amber)', w = 120, h = 34, fill }) {
  const min = Math.min(...data), max = Math.max(...data);
  const rng = (max - min) || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / rng) * (h - 4) - 2;
    return [x, y];
  });
  const d = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
  const a = fill ? `${d} L${w},${h} L0,${h} Z` : '';
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: 'block' }}>
      {fill && <path d={a} fill={fill} opacity={0.25}/>}
      <path d={d} fill="none" stroke={stroke} strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

  const monthlyIn  = NEW_SAMPLE.recurring.filter(r => r.status === 'active' && r.amt > 0).reduce((s, r) => s + r.amt, 0);

  return (
    <div className="scroll-thin" style={{ flex: 1, overflow: 'auto', padding: '20px 24px 100px' }}>
      <ScreenHeader eyebrow="Recurring" title="Bills, subscriptions & auto-saves">

        <APButton variant="primary" size="md" icon="plus">New rule</APButton>
      </ScreenHeader>

      {/* summary */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12, marginBottom: 16 }}>
        <PaperCard padding={18}>
          <div style={{ fontSize: 11, color: 'var(--ink-500)', textTransform: 'uppercase', letterSpacing: 1 }}>Monthly outflow</div>
          <div className="serif" style={{ fontSize: 30, fontWeight: 500, color: 'var(--neg-500)', marginTop: 2 }}>
